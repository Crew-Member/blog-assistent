# Entwicklung: nur Postgres (App laeuft per `npm run dev:api` / `npm run dev:web` auf dem Host).
# Vollstaendiger Betrieb (App + Postgres): docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: blog_assistent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog_assistent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD:-blog}@postgres:5432/blog_assistent
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD muss in .env gesetzt sein}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET muss in .env gesetzt sein}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.anthropic.com}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      RESEARCH_MAX_SEARCHES: ${RESEARCH_MAX_SEARCHES:-8}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-none}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_WIDTH: ${IMAGE_WIDTH:-}
      IMAGE_HEIGHT: ${IMAGE_HEIGHT:-}
      AI_MODEL_LIGHT: ${AI_MODEL_LIGHT:-}
      AI_MODEL_RESEARCH: ${AI_MODEL_RESEARCH:-}
      AI_EFFORT_LIGHT: ${AI_EFFORT_LIGHT:-low}
      AI_PRICE_LIGHT_INPUT_PER_MTOK: ${AI_PRICE_LIGHT_INPUT_PER_MTOK:-3}
      AI_PRICE_LIGHT_OUTPUT_PER_MTOK: ${AI_PRICE_LIGHT_OUTPUT_PER_MTOK:-15}
      AI_PRICE_INPUT_PER_MTOK: ${AI_PRICE_INPUT_PER_MTOK:-5}
      AI_PRICE_OUTPUT_PER_MTOK: ${AI_PRICE_OUTPUT_PER_MTOK:-25}
      AI_PRICE_SEARCH_PER_1000: ${AI_PRICE_SEARCH_PER_1000:-10}
      IMAGE_COST_USD: ${IMAGE_COST_USD:-0}
      IMAGE_PROMPT_LANGUAGE: ${IMAGE_PROMPT_LANGUAGE:-de}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-medium}
      STORAGE_DIR: /data/uploads
      PORT: "3100"
    volumes:
      - uploads:/data/uploads
    # Nur lokal erreichbar; TLS und Domain uebernimmt der vorhandene Caddy (siehe README).
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  postgres-data:
  uploads:
